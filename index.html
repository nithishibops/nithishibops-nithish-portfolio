<style>

    :root {
        --black: #050505;
        --black-2: #080808;
        --charcoal: #0d0d0d;
        --charcoal-2: #121212;
        --card: #111111;
        --card-2: #151515;

        --gold: #d6b36a;
        --gold-light: #f1d99b;
        --gold-bright: #ffe7ad;
        --gold-dark: #9b7534;

        --white: #f7f3ea;
        --white-2: #e9e4d9;
        --muted: #a59f93;
        --muted-2: #77736c;

        --border: rgba(214,179,106,0.22);
        --border-light: rgba(214,179,106,0.38);

        --shadow:
            0 30px 80px rgba(0,0,0,0.55);

        --gold-shadow:
            0 0 30px rgba(214,179,106,0.10);

        --radius: 20px;

        --max-width: 1240px;
    }


    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }


    html {
        scroll-behavior: smooth;
        scroll-padding-top: 90px;
    }


    body {
        min-height: 100vh;

        background:
            radial-gradient(
                circle at 15% 5%,
                rgba(214,179,106,0.075),
                transparent 25%
            ),
            radial-gradient(
                circle at 90% 20%,
                rgba(214,179,106,0.045),
                transparent 28%
            ),
            linear-gradient(
                135deg,
                #030303,
                #090909 45%,
                #050505
            );

        color: var(--white);

        font-family: "Inter", Arial, sans-serif;

        line-height: 1.6;

        overflow-x: hidden;
    }


    body::before {
        content: "";

        position: fixed;

        inset: 0;

        pointer-events: none;

        opacity: 0.025;

        background-image:
            linear-gradient(
                rgba(255,255,255,0.08) 1px,
                transparent 1px
            ),
            linear-gradient(
                90deg,
                rgba(255,255,255,0.08) 1px,
                transparent 1px
            );

        background-size: 80px 80px;

        z-index: -1;
    }


    ::selection {
        background: var(--gold);
        color: #050505;
    }


    a {
        color: inherit;
        text-decoration: none;
    }


    button {
        font-family: inherit;
    }


    img {
        max-width: 100%;
        display: block;
    }


    .container {
        width: min(
            var(--max-width),
            calc(100% - 42px)
        );

        margin: auto;
    }


    /* ==========================================
       SCROLL PROGRESS
    ========================================== */

    .scroll-progress {
        position: fixed;

        top: 0;
        left: 0;

        height: 2px;

        width: 0%;

        background:
            linear-gradient(
                90deg,
                var(--gold-dark),
                var(--gold-light),
                var(--gold-bright)
            );

        box-shadow:
            0 0 12px rgba(214,179,106,0.8);

        z-index: 9999;
    }


    /* ==========================================
       NAVIGATION
    ========================================== */

    nav {
        position: sticky;

        top: 0;

        z-index: 900;

        background:
            rgba(5,5,5,0.84);

        backdrop-filter:
            blur(22px);

        border-bottom:
            1px solid rgba(214,179,106,0.13);
    }


    .nav-inner {
        min-height: 76px;

        display: flex;

        align-items: center;

        justify-content: space-between;
    }


    .brand {
        display: inline-flex;

        align-items: center;

        gap: 8px;

        font-family: "Manrope";

        font-weight: 800;

        font-size: 1.25rem;

        letter-spacing: -0.03em;
    }


    .brand-mark {
        width: 34px;
        height: 34px;

        display: grid;

        place-items: center;

        border:
            1px solid var(--border-light);

        border-radius: 10px;

        color: var(--gold-light);

        background:
            linear-gradient(
                145deg,
                rgba(214,179,106,0.15),
                rgba(214,179,106,0.025)
            );

        box-shadow:
            inset 0 0 18px rgba(214,179,106,0.04);
    }


    .brand span {
        color: var(--gold-light);
    }


    .nav-links {
        display: flex;

        align-items: center;

        gap: 22px;
    }


    .nav-links a {
        color: var(--muted);

        font-size: 0.77rem;

        font-weight: 600;

        transition: 0.25s;
    }


    .nav-links a:hover {
        color: var(--gold-light);
    }


    .nav-resume {
        padding: 9px 14px;

        border:
            1px solid var(--border-light);

        border-radius: 8px;

        color: var(--gold-light) !important;

        background:
            rgba(214,179,106,0.05);
    }


    .mobile-menu {
        display: none;

        width: 42px;
        height: 42px;

        border:
            1px solid var(--border);

        border-radius: 10px;

        background: var(--card);

        color: var(--gold-light);

        cursor: pointer;
    }


    /* ==========================================
       HERO
    ========================================== */

    .hero {
        position: relative;

        padding:
            105px 0 65px;

        min-height:
            calc(100vh - 76px);

        display: flex;

        align-items: center;
    }


    .hero::after {
        content: "";

        position: absolute;

        width: 480px;
        height: 480px;

        right: -220px;
        top: 50px;

        border-radius: 50%;

        border:
            1px solid rgba(214,179,106,0.08);

        box-shadow:
            0 0 100px rgba(214,179,106,0.035);

        pointer-events: none;
    }


    .hero-grid {
        display: grid;

        grid-template-columns:
            1.3fr
            0.7fr;

        gap: 80px;

        align-items: center;
    }


    .eyebrow {
        display: inline-flex;

        align-items: center;

        gap: 8px;

        padding:
            8px 13px;

        border:
            1px solid var(--border);

        border-radius: 999px;

        background:
            linear-gradient(
                135deg,
                rgba(214,179,106,0.10),
                rgba(214,179,106,0.025)
            );

        color: var(--gold-light);

        font-size: 0.68rem;

        font-weight: 700;

        letter-spacing: 0.12em;

        text-transform: uppercase;

        margin-bottom: 22px;

        box-shadow:
            0 0 30px rgba(214,179,106,0.04);
    }


    .eyebrow i {
        font-size: 0.65rem;
    }


    h1 {
        font-family: "Manrope";

        font-size:
            clamp(3.2rem, 7vw, 6rem);

        line-height: 0.95;

        letter-spacing: -0.065em;

        margin-bottom: 22px;
    }


    h1 .gold {
        color: var(--gold-light);

        text-shadow:
            0 0 35px rgba(214,179,106,0.18);
    }


    .hero-title {
        font-family: "Manrope";

        font-size:
            clamp(1.15rem, 2vw, 1.55rem);

        line-height: 1.3;

        color: var(--white-2);

        font-weight: 600;

        margin-bottom: 12px;
    }


    .hero-subtitle {
        color: var(--gold);

        font-size: 0.82rem;

        font-weight: 700;

        letter-spacing: 0.08em;

        text-transform: uppercase;

        margin-bottom: 20px;
    }


    .hero-description {
        max-width: 760px;

        color: var(--muted);

        font-size: 0.95rem;

        line-height: 1.85;
    }


    .hero-actions {
        display: flex;

        flex-wrap: wrap;

        gap: 10px;

        margin-top: 30px;
    }


    .btn {
        position: relative;

        display: inline-flex;

        align-items: center;

        justify-content: center;

        gap: 8px;

        padding:
            12px 17px;

        border:
            1px solid var(--border);

        border-radius: 10px;

        background:
            linear-gradient(
                145deg,
                #171717,
                #0d0d0d
            );

        color: var(--white-2);

        font-size: 0.78rem;

        font-weight: 700;

        overflow: hidden;

        transition:
            transform 0.25s,
            border-color 0.25s,
            box-shadow 0.25s,
            color 0.25s;
    }


    .btn::before {
        content: "";

        position: absolute;

        inset: 0;

        background:
            linear-gradient(
                110deg,
                transparent 30%,
                rgba(255,255,255,0.09),
                transparent 70%
            );

        transform:
            translateX(-120%);

        transition:
            transform 0.55s;
    }


    .btn:hover::before {
        transform:
            translateX(120%);
    }


    .btn:hover {
        transform:
            translateY(-3px);

        border-color:
            var(--gold);

        color:
            var(--gold-light);

        box-shadow:
            0 12px 35px rgba(0,0,0,0.35),
            0 0 25px rgba(214,179,106,0.06);
    }


    .btn-gold {
        color: #090909;

        border-color:
            var(--gold-light);

        background:
            linear-gradient(
                135deg,
                #9f7836,
                #d6b36a 45%,
                #f2daa0 72%,
                #b58b45
            );

        box-shadow:
            0 8px 28px rgba(214,179,106,0.13);
    }


    .btn-gold:hover {
        color: #050505;

        border-color:
            var(--gold-bright);

        box-shadow:
            0 12px 35px rgba(214,179,106,0.2);
    }


    /* ==========================================
       PROFILE
    ========================================== */

    .profile-area {
        display: flex;

        justify-content: center;

        position: relative;
    }


    .profile-frame {
        position: relative;

        width: 320px;
        height: 320px;

        display: grid;

        place-items: center;
    }


    .profile-frame::before {
        content: "";

        position: absolute;

        inset: -13px;

        border:
            1px solid rgba(214,179,106,0.38);

        border-radius: 50%;

        animation:
            slowRotate 18s linear infinite;
    }


    .profile-frame::after {
        content: "";

        position: absolute;

        inset: -28px;

        border:
            1px solid rgba(214,179,106,0.08);

        border-radius: 50%;
    }


    .profile-image {
        position: relative;

        z-index: 2;

        width: 280px;
        height: 280px;

        object-fit: cover;

        border-radius: 50%;

        border:
            3px solid var(--gold);

        background:
            #111;

        box-shadow:
            0 0 0 8px rgba(214,179,106,0.04),
            0 25px 80px rgba(0,0,0,0.7),
            0 0 55px rgba(214,179,106,0.11);
    }


    .profile-badge {
        position: absolute;

        z-index: 5;

        right: -12px;
        bottom: 18px;

        padding:
            10px 13px;

        border:
            1px solid var(--border-light);

        border-radius: 10px;

        background:
            rgba(13,13,13,0.9);

        backdrop-filter:
            blur(14px);

        color: var(--gold-light);

        font-size: 0.68rem;

        font-weight: 700;

        box-shadow:
            var(--shadow);
    }


    .profile-caption {
        margin-top: 28px;

        text-align: center;

        color: var(--muted);

        font-size: 0.72rem;

        letter-spacing: 0.06em;

        text-transform: uppercase;
    }


    @keyframes slowRotate {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }


    /* ==========================================
       METRICS
    ========================================== */

    .metrics-section {
        padding:
            10px 0 80px;
    }


    .metrics-grid {
        display: grid;

        grid-template-columns:
            repeat(7, 1fr);

        gap: 10px;
    }


    .metric {
        position: relative;

        padding:
            20px 15px;

        min-height: 112px;

        border:
            1px solid var(--border);

        border-radius: 14px;

        background:
            linear-gradient(
                145deg,
                rgba(22,22,22,0.95),
                rgba(9,9,9,0.95)
            );

        overflow: hidden;

        transition:
            transform 0.25s,
            border-color 0.25s,
            box-shadow 0.25s;
    }


    .metric::after {
        content: "";

        position: absolute;

        width: 100px;
        height: 100px;

        right: -50px;
        top: -50px;

        border-radius: 50%;

        background:
            rgba(214,179,106,0.05);
    }


    .metric:hover {
        transform:
            translateY(-4px);

        border-color:
            var(--border-light);

        box-shadow:
            var(--gold-shadow);
    }


    .metric-number {
        display: block;

        font-family: "Manrope";

        font-size: 1.65rem;

        font-weight: 800;

        color: var(--gold-light);

        line-height: 1.1;

        margin-bottom: 7px;
    }


    .metric-label {
        display: block;

        color: var(--muted);

        font-size: 0.67rem;

        line-height: 1.35;
    }

       GENERAL SECTIONS
    ========================================== */

    section {
        padding:
            95px 0;
    }


    .section-head {
        max-width: 820px;

        margin-bottom: 42px;
    }


    .section-label {
        display: flex;

        align-items: center;

        gap: 10px;

        color: var(--gold);

        font-size: 0.68rem;

        font-weight: 800;

        letter-spacing: 0.15em;

        text-transform: uppercase;

        margin-bottom: 10px;
    }


    .section-label::before {
        content: "";

        width: 25px;

        height: 1px;

        background:
            linear-gradient(
                90deg,
                var(--gold),
                transparent
            );
    }


    .section-title {
        font-family: "Manrope";

        font-size:
            clamp(2rem, 4vw, 3.1rem);

        line-height: 1.08;

        letter-spacing: -0.045em;

        color: var(--white);
    }


    .section-description {
        color: var(--muted);

        font-size: 0.9rem;

        line-height: 1.8;

        margin-top: 14px;

        max-width: 760px;
    }


    /* ==========================================
       PROFILE DOMAINS
    ========================================== */

    .domain-grid {
        display: grid;

        grid-template-columns:
            repeat(4, 1fr);

        gap: 15px;
    }


    .domain-card {
        position: relative;

        min-height: 235px;

        padding: 26px;

        border:
            1px solid var(--border);

        border-radius: var(--radius);

        background:
            linear-gradient(
                145deg,
                #151515,
                #0a0a0a
            );

        overflow: hidden;

        transition:
            transform 0.3s,
            border-color 0.3s,
            box-shadow 0.3s;
    }


    .domain-card::before {
        content: "";

        position: absolute;

        left: 0;
        right: 0;
        top: 0;

        height: 1px;

        background:
            linear-gradient(
                90deg,
                transparent,
                var(--gold),
                transparent
            );

        opacity: 0.45;
    }


    .domain-card:hover {
        transform:
            translateY(-7px);

        border-color:
            var(--border-light);

        box-shadow:
            var(--shadow),
            0 0 30px rgba(214,179,106,0.05);
    }


    .domain-icon {
        width: 48px;
        height: 48px;

        display: grid;

        place-items: center;

        border:
            1px solid var(--border);

        border-radius: 13px;

        color: var(--gold-light);

        background:
            rgba(214,179,106,0.06);

        font-size: 1.1rem;

        margin-bottom: 20px;
    }


    .domain-number {
        position: absolute;

        right: 20px;
        top: 18px;

        color:
            rgba(214,179,106,0.18);

        font-family:
            "Manrope";

        font-size:
            2rem;

        font-weight: 800;
    }


    .domain-card h3 {
        font-family: "Manrope";

        font-size: 1rem;

        margin-bottom: 10px;
    }


    .domain-card p {
        color: var(--muted);

        font-size: 0.78rem;

        line-height: 1.75;
    }


    /* ==========================================
       CAPITAL MARKETS
    ========================================== */

    .capital-section {
        background:
            linear-gradient(
                180deg,
                transparent,
                rgba(214,179,106,0.018),
                transparent
            );
    }


    .capital-dashboard {
        display: grid;

        grid-template-columns:
            0.85fr
            1.15fr;

        gap: 18px;

        padding: 22px;

        border:
            1px solid var(--border);

        border-radius: 24px;

        background:
            linear-gradient(
                145deg,
                #131313,
                #080808
            );

        box-shadow:
            var(--shadow);
    }


    .capital-highlight {
        position: relative;

        display: flex;

        flex-direction: column;

        justify-content: center;

        min-height: 360px;

        padding: 32px;

        border:
            1px solid rgba(214,179,106,0.15);

        border-radius: 18px;

        background:
            radial-gradient(
                circle at 20% 20%,
                rgba(214,179,106,0.09),
                transparent 35%
            ),
            #0b0b0b;

        overflow: hidden;
    }


    .capital-highlight::after {
        content: "";

        position: absolute;

        width: 220px;
        height: 220px;

        right: -100px;
        bottom: -100px;

        border:
            1px solid rgba(214,179,106,0.08);

        border-radius: 50%;
    }


    .capital-highlight .big-number {
        font-family: "Manrope";

        font-size:
            clamp(4rem, 8vw, 7rem);

        line-height: 0.9;

        color: var(--gold-light);

        letter-spacing: -0.07em;

        text-shadow:
            0 0 45px rgba(214,179,106,0.12);
    }


    .capital-highlight h3 {
        font-family: "Manrope";

        font-size: 1.4rem;

        margin:
            20px 0 8px;
    }


    .capital-highlight p {
        color: var(--muted);

        font-size: 0.8rem;

        line-height: 1.7;
    }


    .capital-grid {
        display: grid;

        grid-template-columns:
            repeat(2, 1fr);

        gap: 12px;
    }


    .capital-card {
        padding: 23px;

        border:
            1px solid var(--border);

        border-radius: 15px;

        background:
            #101010;

        transition: 0.25s;
    }


    .capital-card:hover {
        border-color:
            var(--border-light);

        background:
            #141414;
    }


    .capital-card i {
        color: var(--gold);

        font-size: 0.85rem;

        margin-bottom: 14px;
    }


    .capital-card strong {
        display: block;

        font-family: "Manrope";

        font-size: 1.55rem;

        color: var(--gold-light);
    }


    .capital-card span {
        color: var(--muted);

        font-size: 0.7rem;
    }


    /* ==========================================
       EXPERIENCE
    ========================================== */

    .timeline {
        position: relative;

        max-width: 1000px;

        margin: auto;
    }


    .timeline::before {
        content: "";

        position: absolute;

        left: 20px;

        top: 0;
        bottom: 0;

        width: 1px;

        background:
            linear-gradient(
                var(--gold),
                rgba(214,179,106,0.05)
            );
    }


    .experience {
        position: relative;

        padding-left: 65px;

        margin-bottom: 26px;
    }


    .timeline-dot {
        position: absolute;

        left: 12px;
        top: 27px;

        width: 17px;
        height: 17px;

        border-radius: 50%;

        background:
            var(--gold);

        border:
            4px solid var(--black);

        box-shadow:
            0 0 0 1px var(--gold),
            0 0 25px rgba(214,179,106,0.35);
    }


    .experience-card {
        position: relative;

        padding: 28px;

        border:
            1px solid var(--border);

        border-radius: 20px;

        background:
            linear-gradient(
                145deg,
                #151515,
                #0c0c0c
            );

        transition:
            border-color 0.25s,
            transform 0.25s,
            box-shadow 0.25s;
    }


    .experience-card::before {
        content: "";

        position: absolute;

        top: 0;
        left: 25px;
        right: 25px;

        height: 1px;

        background:
            linear-gradient(
                90deg,
                transparent,
                var(--gold),
                transparent
            );

        opacity: 0.35;
    }


    .experience-card:hover {
        transform:
            translateX(5px);

        border-color:
            var(--border-light);

        box-shadow:
            var(--shadow);
    }


    .experience-header {
        display: flex;

        align-items: flex-start;

        justify-content: space-between;

        gap: 20px;

        margin-bottom: 16px;
    }


    .experience h3 {
        font-family: "Manrope";

        font-size: 1.15rem;

        margin-bottom: 3px;
    }


    .company {
        color: var(--gold);

        font-size: 0.78rem;

        font-weight: 700;
    }


    .date {
        white-space: nowrap;

        color: var(--muted-2);

        font-size: 0.7rem;

        padding:
            7px 10px;

        border:
            1px solid var(--border);

        border-radius: 7px;
    }


    .experience ul {
        margin-left: 18px;
    }


    .experience li {
        color: #b9b4aa;

        font-size: 0.8rem;

        margin: 8px 0;

        padding-left: 3px;
    }


    .experience li::marker {
        color: var(--gold);
    }


    /* ==========================================
       PROJECT FILTERS
    ========================================== */

    .project-filter {
        display: flex;

        flex-wrap: wrap;

        gap: 8px;

        margin-bottom: 28px;
    }


    .filter-btn {
        cursor: pointer;

        padding:
            9px 13px;

        border:
            1px solid var(--border);

        border-radius: 999px;

        background:
            #0e0e0e;

        color: var(--muted);

        font-size: 0.68rem;

        font-weight: 700;

        transition: 0.2s;
    }


    .filter-btn:hover,
    .filter-btn.active {
        color: #080808;

        background:
